<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

  /* ===== NAV 容器 ===== */
  nav {
    position: sticky;
    top: 0;
    width: 100%;
    padding: 4rem 2rem;

    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid rgba(0, 255, 255, 0.3);
    font-family: 'Orbitron', sans-serif;
    overflow: visible;
    z-index: 1000;
    /* nav 在最上層 */
  }

  /* ===== 光粒子背景（在最底層） ===== */
  .nav-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    /* ✅ 放在最底層 */
    overflow: hidden;
  }

  .nav-bg::before,
  .nav-bg::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background-image: radial-gradient(circle, rgba(0, 255, 255, 0.4) 1px, transparent 1px);
    background-size: 80px 80px;
    animation: floatParticles 20s linear infinite;
    opacity: 0.3;
  }

  .nav-bg::after {
    background-size: 100px 100px;
    animation: floatParticles2 25s linear infinite reverse;
    opacity: 0.2;
  }

  @keyframes floatParticles {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }

    100% {
      transform: translate(-50px, -50px) rotate(360deg);
    }
  }

  @keyframes floatParticles2 {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }

    100% {
      transform: translate(50px, 50px) rotate(-360deg);
    }
  }

  /* ===== LOGO ===== */
  .logo {
    /* color: rgb(232, 203, 9);
    font-size: 1.6rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    z-index: 2; */
    /* ✅ 在背景之上 */
    min-width: 50%;
    /* background-image: url('./../images/logo_white.png'); */
    background-size: contain;
    background-repeat: no-repeat;
    width: 95%;
    height: 67px;
    display: flex;
    margin: 6px;
    filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.4));
  }

  .logo:hover {
    color: #fff;
    text-shadow: 0 0 30px #0ff, 0 0 60px #0ff;
  }

  /* ===== NAV LINKS ===== */
  ul.nav-links {
    list-style: none;
    display: flex;
    gap: 2rem;
    margin: 0;
    z-index: 2;
    /* ✅ 顯示在前面 */
  }

  ul.nav-links li a {
    text-decoration: none;
    color: #0ff;
    font-weight: 500;
    position: relative;
    padding: 0.5rem 1rem;
    transition: 0.3s ease;
  }

  ul.nav-links li a:hover {
    color: #fff;
    text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
  }

  ul.nav-links li a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0%;
    height: 2px;
    background: linear-gradient(90deg, #0ff, #fff, #0ff);
    transition: width 0.3s ease;
  }

  ul.nav-links li a:hover::after {
    width: 100%;
  }

  /* ===== 電流底線動畫 ===== */
  nav::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: -200%;
    width: 300%;
    height: 2px;
    background: linear-gradient(90deg, #00ffff, #ffffff, #00ffff);
    animation: lineFlow 2.5s linear infinite;
    z-index: 1;
    /* 底線在背景上但在文字下 */
  }

  @keyframes lineFlow {
    0% {
      transform: translateX(0);
    }

    100% {
      transform: translateX(-66.66%);
    }
  }

  /* ===== 漢堡按鈕 ===== */
  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 24px;
    height: 18px;
    cursor: pointer;
    z-index: 3;
    /* 最上層 */
  }

  .hamburger span {
    display: block;
    height: 3px;
    background: #0ff;
    border-radius: 3px;
    transition: all 0.3s ease;
  }

  /* ===== Dropdown (Desktop & Mobile) ===== */
  /* Base dropdown container positioning so desktop can position absolute */
  .nav-links .dropdown {
    position: relative;
  }

  /* Desktop dropdown menu default (hidden) */
  .nav-links .dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: rgba(0, 20, 30, 0.95);
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 8px;
    list-style: none;
    display: none;
    flex-direction: column;
    min-width: 180px;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    transition: all 0.15s ease;
    z-index: 1000;
    /* Increased z-index to ensure visibility */
  }

  /* show on hover / focus for desktop, or when JS toggles .active */
  .nav-links .dropdown:hover>.dropdown-menu,
  .nav-links .dropdown:focus-within>.dropdown-menu,
  .nav-links .dropdown-menu.active {
    display: flex;
  }

  /* 內部連結樣式 */
  .nav-links .dropdown-menu li a {
    padding: 0.75rem 1rem;
    display: block;
    color: #0ff;
    transition: 0.3s;
  }

  .nav-links .dropdown-menu li a:hover {
    background: rgba(245, 142, 9, 0.05);
    color: #fff;
  }

  /* ===== RWD ===== */
  @media (max-width: 768px) {
    .hamburger {
      display: flex;
    }

    .logo {
      display: none;
      /* logo 收進漢堡選單 */

    }


  }

  .offcanvas-logo {
    background-image: url('images/logo_white.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;   /* ✅ 圖片置中 */
    width: 200px;
    height: 50px;
    margin: 10px auto;
    background-size: auto 100%
  }

  
</style>
