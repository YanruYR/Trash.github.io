<body>

	<div class="gtco-loader"></div>

	<div id="page">
		<!-- Nav -->
		<div id="nav"></div>
		<!-- END Nav -->
		<!-- The modal -->
		<div class="modal fade" id="flipFlop" tabindex="-1" role="dialog" aria-labelledby="modalLabel"
			aria-hidden="true">
			<div class="modal-dialog" role="document">
				<form class="navbar-form navbar-left" role="search">

					</div>
					<button type="submit" class="btn btn-default">Submit</button>
				</form>
			</div>
		</div>
		<!-- The modal -->

		<header id="gtco-header" class="gtco-cover gtco-cover-xs" role="banner"
			style="">
			<div class="overlay"></div>
			<div class="gtco-container">
				<div class="row">
					<div class="col-md-8 col-md-offset-2 text-center">
						<div class="display-t">
							<div class="display-tc">
								<h1 class="animate-box" data-animate-effect="fadeInUp">PORTFOLIO</h1>

							</div>
						</div>
					</div>
				</div>
			</div>
		</header>



		<div class="gtco-container">
			<div class="row">
				<div class="filter-buttons animate-box" >
					<button class="active animate-box" data-type="men">Men's</button>
					<button data-type="ladie">Ladie's</button>
					<button data-type="other">Other</button>
				</div>

				<div class="image-container" id="imageContainer"></div>
				<div class="loading" id="loading">載入中...</div>

			</div>
		</div>





	</div>



	<!-- Footer -->

	<div id="footer"></div>
	<!-- END Footer -->

	<div class="gototop js-top">
		<a href="#" class="js-gotop"><i class="icon-arrow-up"></i></a>
	</div>

	<!-- jQuery -->
	<script src="js/jquery.min.js"></script>
	<!-- jQuery Easing -->
	<script src="js/jquery.easing.1.3.js"></script>
	<!-- Bootstrap -->
	<script src="js/bootstrap.min.js"></script>
	<!-- Waypoints -->
	<script src="js/jquery.waypoints.min.js"></script>
	<!-- Carousel -->
	<script src="js/owl.carousel.min.js"></script>
	<!-- countTo -->
	<script src="js/jquery.countTo.js"></script>
	<!-- Magnific Popup -->
	<script src="js/jquery.magnific-popup.min.js"></script>
	<script src="js/magnific-popup-options.js"></script>
	<!-- Main -->
	<script src="js/main.js"></script>
	<script>
		const container = document.getElementById('imageContainer');
		const loading = document.getElementById('loading');
		const buttons = document.querySelectorAll('.filter-buttons button');

		let currentType = 'men';
		let page = 1;
		let isLoading = false;

		// 設定每類型的總圖片數量
		const imageData = {
			men: 20,
			ladie: 20,
			other: 20
		};
		const imagesPerPage = 8;

		// 懶加載觀察器
		const observer = new IntersectionObserver(entries => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const img = entry.target;
					img.src = img.dataset.src;
					observer.unobserve(img);
				}
			});
		});

		// 主要載入函式
		function loadImages() {
			if (isLoading) return;
			isLoading = true;
			loading.style.display = 'block';

			setTimeout(() => {
				const totalImages = imageData[currentType];
				const start = (page - 1) * imagesPerPage + 1;
				const end = Math.min(start + imagesPerPage - 1, totalImages);

				for (let i = start; i <= end; i++) {
					const img = document.createElement('img');
					img.dataset.src = `portfolio/${currentType}${i}.jpg`; // e.g. image/short1.jpg
					img.onload = () => img.classList.add('loaded');
					observer.observe(img);
					container.appendChild(img);
				}

				page++;
				isLoading = false;
				loading.style.display = 'none';

				if (end >= totalImages) {
					loading.textContent = "🎉 該分類已全部載入完畢";
					window.removeEventListener('scroll', handleScroll);
				}
			}, 600);
		}

		function handleScroll() {
			if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 150) {
				loadImages();
			}
		}

		// 切換分類
		buttons.forEach(btn => {
			btn.addEventListener('click', () => {
				buttons.forEach(b => b.classList.remove('active'));
				btn.classList.add('active');
				currentType = btn.dataset.type;
				page = 1;
				container.innerHTML = '';
				loading.textContent = '載入中...';
				window.addEventListener('scroll', handleScroll);
				loadImages();
			});
		});

		// 初始載入
		window.addEventListener('scroll', handleScroll);
		loadImages();
	</script>
	<style>
		body {
			font-family: "Noto Sans TC", sans-serif;
			margin: 0;
			background-color: #f5f5f5;
		}

		h1 {
			text-align: center;
			padding: 20px 0 10px;
			color: #333;
			letter-spacing: 1px;
		}

		/* --- 分類按鈕區 --- */
		.filter-buttons {
			text-align: center;
			margin-bottom: 10px;
		}

		.filter-buttons button {
			margin: 6px;
			padding: 8px 16px;
			font-size: 16px;
			border: none;
			border-radius: 20px;
			background-color: #ddd;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.filter-buttons button.active {
			background-color: #333;
			color: white;
		}

		.filter-buttons button:hover {
			background-color: #666;
			color: white;
		}

		/* --- 圖片區 --- */
		.image-container {
			column-count: 4;
			column-gap: 12px;
			padding: 12px;
		}

		.image-container img {
			width: 100%;
			margin-bottom: 12px;
			border-radius: 10px;
			background: #e0e0e0;
			opacity: 0;
			transition: opacity 0.5s ease;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
		}

		.image-container img.loaded {
			opacity: 1;
		}

		@media (max-width: 900px) {
			.image-container {
				column-count: 3;
			}
		}

		@media (max-width: 600px) {
			.image-container {
				column-count: 2;
			}
		}

		.loading {
			text-align: center;
			padding: 20px;
			font-size: 16px;
			color: #666;
		}
	</style>

</body>
