<body>

	<div class="gtco-loader"></div>

	<div id="page">
		<!-- Nav -->
		<div id="nav"></div>
		<!-- END Nav -->
		<!-- The modal -->
		<div class="modal fade" id="flipFlop" tabindex="-1" role="dialog" aria-labelledby="modalLabel"
			aria-hidden="true">
			<div class="modal-dialog" role="document">
				<form class="navbar-form navbar-left" role="search">
					<div class="form-group">
						<input type="text" class="form-control" placeholder="Search">
					</div>
					<button type="submit" class="btn btn-default">Submit</button>
				</form>
			</div>
		</div>
		<!-- The modal -->

		<header id="gtco-header" class="gtco-cover gtco-cover-xs" role="banner"
			style="background-image:url(images/img_bg_1.jpg);">
			<div class="overlay"></div>
			<div class="gtco-container">
				<div class="row">
					<div class="col-md-8 col-md-offset-2 text-center">
						<div class="display-t">
							<div class="display-tc">
								<h1 class="animate-box" data-animate-effect="fadeInUp">NEWS</h1>

							</div>
						</div>
					</div>
				</div>
			</div>
		</header>
		
		<div class="image-container" id="imageContainer"></div>
		<div class="loading" id="loading">載入中...</div>

		<script>
			const w = Math.floor(Math.random() * 200) + 200; // 寬200~400
			const h = Math.floor(Math.random() * 200) + 200; // 高200~400
			

			const container = document.getElementById('imageContainer');
			const loading = document.getElementById('loading');
			let page = 1;
			let isLoading = false;

			// 懶加載觀察器
			const observer = new IntersectionObserver(entries => {
				entries.forEach(entry => {
					if (entry.isIntersecting) {
						const img = entry.target;
						img.src = img.dataset.src; // 真正載入圖片
						observer.unobserve(img);
					}
				});
			});

			function loadImages() {
				if (isLoading) return;
				isLoading = true;
				loading.style.display = 'block';

				setTimeout(() => {
					for (let i = 0; i < 10; i++) {
						const img = document.createElement('img');
						const w = Math.floor(Math.random() * 200) + 200;
						const h = Math.floor(Math.random() * 200) + 200;

						img.dataset.src = `https://picsum.photos/${w}/${h}?random=${page * 10 + i}`; // 暫存 URL
						observer.observe(img);

						img.onload = () => img.classList.add('loaded');
						container.appendChild(img);
					}

					page++;
					isLoading = false;
					loading.style.display = 'none';
				}, 800);
			}

			// 監聽滾動
			window.addEventListener('scroll', () => {
				if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
					loadImages();
				}
			});

			// 初始載入
			loadImages();
		</script>




	</div>
